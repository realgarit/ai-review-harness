# Gitea Actions equivalent of ../../.github/workflows/ai-review.yml.
# Gitea Actions is YAML-compatible with GitHub Actions for basic steps and
# most github.com marketplace actions, but the PR-comment step below uses
# Gitea's own API instead of the gh CLI (Gitea doesn't have an equivalent
# CLI action installed by default) - this file is UNVERIFIED against a
# real Gitea instance (built without access to one). Adjust runs-on to
# match your actual runner label, and sanity-check the API call against
# your Gitea version's docs before trusting the fail-check.
#
# Choose your AI model by setting AI_MODEL (default: claude). Each provider
# needs its own secrets — see scripts/invoke-model.sh for the full list.
name: ai-review

on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest # change to your Gitea runner's label
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Compute PR diff
        env:
          BASE_REF: ${{ gitea.base_ref }}
        run: bash scripts/compute-diff.sh

      - name: Run Semgrep
        run: bash scripts/run-semgrep.sh

      - name: Install model CLI (if needed)
        env:
          AI_MODEL: claude
        run: |
          case "${AI_MODEL}" in
            claude) npm install -g @anthropic-ai/claude-code ;;
            codex)  npm install -g @openai/codex ;;
            *)      echo "AI_MODEL=${AI_MODEL} uses API (curl+jq), no CLI install needed" ;;
          esac

      - name: Run AI review
        env:
          AI_MODEL: claude
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENAI_COMPAT_BASE_URL: ${{ secrets.OPENAI_COMPAT_BASE_URL }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
        run: bash scripts/run-ai-review.sh

      - name: Format combined comment
        run: python3 scripts/format-review-comment.py semgrep.json ai-review.txt > comment.md

      # Gitea's issue-comment API treats PRs as issues, same as GitHub's
      # does - POST /repos/{owner}/{repo}/issues/{index}/comments. Needs a
      # GITEA_TOKEN secret (a personal access token with issue:write scope)
      # since gitea.token isn't a thing the way github.token is.
      - name: Post PR comment
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          PR_NUMBER: ${{ gitea.event.pull_request.number }}
        run: |
          body=$(python3 -c "import json,sys; print(json.dumps({'body': open('comment.md').read()}))")
          curl -sf -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body" \
            "$GITEA_SERVER/api/v1/repos/$REPO/issues/$PR_NUMBER/comments"

      - name: Fail check if findings exist
        run: |
          # Count findings from the sources, not by grepping the combined
          # comment with an allow-list - the AI reviewer legitimately writes
          # a summary sentence around its "No findings." line, and any such
          # prose line tripped the old grep into a false-positive exit 1.
          # Findings are machine-detectable: Semgrep's JSON results array,
          # and the AI review's `- **file:line**` bullet lines.
          if ! SEMGREP_COUNT=$(python3 -c 'import json; print(len(json.load(open("semgrep.json")).get("results", [])))' 2>/dev/null); then
            echo "Could not parse semgrep.json - failing check so it gets looked at."
            exit 1
          fi
          AI_COUNT=$(grep -c '^- \*\*' ai-review.txt || true)
          echo "Semgrep findings: $SEMGREP_COUNT, AI review findings: $AI_COUNT"
          if [ "$AI_COUNT" -eq 0 ] && ! grep -q "No findings." ai-review.txt; then
            echo "AI review output has neither findings nor a 'No findings.' marker - review likely failed, see PR comment."
            exit 1
          fi
          if [ "$SEMGREP_COUNT" -gt 0 ] || [ "$AI_COUNT" -gt 0 ]; then
            echo "Findings reported - see PR comment."
            exit 1
          fi
