# Copy this file (and scripts/) into a repo's own .github/workflows/ directory
# to run the deterministic GitHub review gate. Contextual AI review is provided
# by native Codex Code Review configured in Codex Cloud; this workflow must not
# start a second provider action or require an API key in the checkout job.
#
# The Gitea workflow remains the trusted-runner compatibility path for the
# configurable provider dispatcher and full AI review.
name: semgrep-review

on:
  pull_request:

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Compute PR diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash scripts/compute-diff.sh

      - name: Run Semgrep
        run: bash scripts/run-semgrep.sh

      - name: Format Semgrep comment
        run: |
          python3 - semgrep.json > comment.md <<'PYEOF'
          """Format the deterministic Semgrep report as a PR comment."""
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              data = json.load(file)
          results = data.get("results", [])
          if not results:
              section = "No Semgrep findings."
          else:
              lines = []
              for result in results:
                  path = result.get("path", "?")
                  line = result.get("start", {}).get("line", "?")
                  severity = result.get("extra", {}).get("severity", "?")
                  message = result.get("extra", {}).get("message", "").strip()
                  check_id = result.get("check_id", "?")
                  lines.append(
                      f"- **{path}:{line}** ({severity}, `{check_id}`) - {message}"
                  )
              section = "\n".join(lines)

          print("## Automated security review\n")
          print("### Semgrep (deterministic)\n")
          print(section)
          print("\nNative Codex Code Review provides the contextual AI review for this repository.")
          PYEOF

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

      - name: Fail check if findings exist
        run: |
          if ! SEMGREP_COUNT=$(python3 -c 'import json; print(len(json.load(open("semgrep.json")).get("results", [])))' 2>/dev/null); then
            echo "Could not parse semgrep.json - failing check so it gets looked at."
            exit 1
          fi
          echo "Semgrep findings: $SEMGREP_COUNT"
          if [ "$SEMGREP_COUNT" -gt 0 ]; then
            echo "Findings reported - see PR comment."
            exit 1
          fi
